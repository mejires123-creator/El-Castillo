const catH=()=>`${topbar(amb==='todos'?'Inventario':A(amb)[1]+' '+A(amb)[2])}<div class="sr"><input id="s" placeholder="Buscar mueble o código…" value="${esc(q)}" oninput="q=this.value;gd()"></div><div class="ch">${[['todos','📋','Todos'],...AMB].map(a=>`<button class="${amb===a[0]?'on':''}" onclick="amb='${a[0]}';render(1)"><b>${a[1]}</b>${a[2]}</button>`).join('')}</div><div id="g" class="gr"></div>`;

const lockH=()=>`${topbar('Ajustes')}<div class="pad"><div class="lk">🔒</div><h2 style="text-align:center">Acceso del administrador</h2><input id="pw" type="password" placeholder="Contraseña" autocomplete="off"><button class="y w" onclick="unlock()">Entrar</button><p id="er" class="er"></p></div>`;
async function unlock(){const e=$('#er');if(Date.now()<+lsg('ecl'))return e.textContent='Demasiados intentos. Espera 1 minuto.';
if(await sha($('#pw').value)===S.cfg.h){admin=true;ls('ecf',0);route()}else{const n=(+lsg('ecf')||0)+1;ls('ecf',n);if(n>=5){ls('ecl',Date.now()+60000);ls('ecf',0)}e.textContent='Contraseña incorrecta.'}}
const fld=(id,l,v,p)=>`<label>${l}</label><input id="${id}" value="${esc(v)}" placeholder="${p||''}">`;
const ajH=()=>`${topbar('Ajustes')}<div class="pad"><h4>🏢 Negocio y contacto</h4>${fld('c_n','Nombre del negocio',S.cfg.name)}${fld('c_g','Frase bajo el logo',S.cfg.tag||'')}${fld('c_w','WhatsApp para pedidos (con código de país)',S.cfg.wa,'591XXXXXXXX')}${fld('c_v','WhatsApp del dueño para reportes de venta (si es distinto)',S.cfg.wv||'','591XXXXXXXX')}${fld('c_f','Enlace de Facebook',S.cfg.fb,'https://')}${fld('c_i','Enlace de Instagram',S.cfg.ig,'https://')}${fld('c_t','Enlace de TikTok',S.cfg.tt,'https://')}<button class="y w" onclick="svC()">Guardar datos</button><h4>☁️ Guardar en GitHub</h4><small style="color:var(--mu)">Para que los cambios queden guardados para todos los vendedores.</small><label>Usuario de GitHub</label><input id="g_u" value="${esc((S.cfg.gh||{}).u)}"><label>Repositorio</label><input id="g_r" value="${esc((S.cfg.gh||{}).r)}" placeholder="El-Castillo"><label>Rama</label><input id="g_b" value="${esc((S.cfg.gh||{}).b||'main')}"><label>Token de acceso (solo se guarda en este dispositivo)</label><input id="g_t" type="password" placeholder="${lsg('ect')?'•••••••• (ya guardado)':'github_pat_…'}" autocomplete="off"><button class="y w" onclick="svG()">Guardar conexión</button><button class="g2 w" onclick="ghTest()">🔌 Probar conexión</button><p id="gst" style="color:var(--mu);font-size:14px;margin:8px 0">${lsg('ecq')||pendPics()?'⚠️ Hay cambios o fotos sin enviar a GitHub; se enviarán solos al abrir o actualizar la página.':''}</p><h4>🔑 Cambiar contraseña</h4><input id="np" type="password" placeholder="Nueva contraseña (mínimo 6)"><button class="g2 w" onclick="svP()">Cambiar contraseña</button><h4>📦 Inventario</h4><button class="y w" style="margin:0 0 6px" onclick="ed()">＋ Añadir mueble</button>${S.items.map(i=>`<div class="ir"><div><b>${esc(i.n)}</b><small>${esc(i.c)} · ${A(i.a)[2]} · Stock ${esc(i.s)}</small></div>${rmId===i.id?`<button class="dn" onclick="rmY('${i.id}')">Sí, eliminar</button><button onclick="rmId='';render(1)">No</button>`:`<button onclick="ed('${i.id}')">✏️</button><button onclick="rmId='${i.id}';render(1)">🗑️</button>`}</div>`).join('')}<button class="g2 w" onclick="admin=false;depth=0;location.hash=''">Cerrar sesión de ajustes</button></div>`;
async function done(){const ok=await save();toast(ok===1?'Guardado para todos los vendedores':ok===2?(pendPics()?'Guardado, pero hay fotos sin subir. Se reintentarán al abrir la página':'Guardado en GitHub. Se verá en 1 o 2 minutos'):lsg('ect')?'❌ '+ghErr:'Guardado solo en este dispositivo')}
function svC(){const g=i=>$('#'+i).value.trim();S.cfg.name=g('c_n')||S.cfg.name;S.cfg.wa=g('c_w');S.cfg.tag=g('c_g');S.cfg.wv=g('c_v');$('#tg').textContent=S.cfg.tag;S.cfg.fb=g('c_f');S.cfg.ig=g('c_i');S.cfg.tt=g('c_t');$('#t').textContent=S.cfg.name;document.title=S.cfg.name+' · Catálogo';done()}
async function svP(){const p=$('#np').value;if(p.length<6)return toast('Mínimo 6 caracteres');S.cfg.h=await sha(p);$('#np').value='';done()}
function rmY(id){S.items=S.items.filter(i=>i.id!==id);rmId='';render(1);done()}
function ed(id){edit=id?JSON.parse(JSON.stringify(S.items.find(i=>i.id===id))):{id:'i'+Date.now(),n:'',c:'',m:'',p:'',s:'',a:'hogar',col:[],d:'',img:'',_new:1};go('editar')}
function rd(){const g=i=>$('#'+i).value;edit.n=g('f_n');edit.c=g('f_c');edit.m=g('f_m');edit.p=g('f_p');edit.s=g('f_s');edit.a=g('f_a');edit.d=g('f_d');edit.f=$('#f_f').checked?1:0}
function addc(){const v=$('#f_nc').value.trim();if(v&&!edit.col.includes(v))edit.col.push(v);render(1)}
const edH=()=>`${topbar(edit._new?'Añadir mueble':'Editar mueble')}<div class="pad"><label>Fotos (la primera es la portada)</label><div class="pg">${pics(edit).map((p,k)=>`<div class="pt"><img src="${esc(src(p.t))}" alt=""><button onclick="rd();pmv(${k})">★</button><button onclick="rd();pdl(${k})">✕</button></div>`).join('')}</div><input type="file" accept="image/*" multiple onchange="ph(this)" style="pointer-events:auto"><small style="color:var(--mu)">Se guardan en alta calidad. Puedes elegir varias a la vez.</small>${fld('f_n','Nombre del mueble',edit.n)}<div class="two"><div>${fld('f_c','Código',edit.c,'EM-001')}</div><div>${fld('f_m','Medidas',edit.m,'180x90x40 cm')}</div></div><div class="two"><div>${fld('f_p','Precio (Bs.)',edit.p)}</div><div>${fld('f_s','Stock',edit.s)}</div></div><label>Ambiente</label><select id="f_a">${AMB.map(a=>`<option value="${a[0]}" ${a[0]===edit.a?'selected':''}>${a[1]} ${a[2]}</option>`).join('')}</select><label>Colores disponibles</label><div class="cc">${edit.col.map((c,k)=>`<button class="on" onclick="rd();edit.col.splice(${k},1);render(1)">${esc(c)} ✕</button>`).join('')}</div><div class="two"><input id="f_nc" placeholder="Ej.: Negro"><button class="g2" onclick="rd();addc()">＋ Añadir color</button></div><label><input type="checkbox" id="f_f" ${edit.f?'checked':''} style="width:auto;margin-right:8px">⭐ Producto destacado (sale en el inicio)</label><label>Descripción</label><textarea id="f_d" rows="3">${esc(edit.d)}</textarea><button class="y w" onclick="svI()">Guardar mueble</button><button class="g2 w" onclick="bk()">Cancelar</button></div>`;
function svI(){rd();if(!edit.n.trim()||!edit.c.trim())return toast('Falta nombre o código');edit.p=+edit.p||0;edit.s=Math.max(0,+edit.s||0);const n=edit._new;delete edit._new;const k=S.items.findIndex(i=>i.id===edit.id);k<0?S.items.push(edit):S.items[k]=edit;if(cur)cur=S.items.find(i=>i.id===cur.id)||cur;edit=null;done();bk()}
function route(){let h=location.hash.slice(1);if(h==='ajustes'&&!admin)h='lock';if(h==='editar'&&(!admin||!edit))h=admin?'ajustes':'lock';if(/^(detalle|pedido|venta)$/.test(h)&&!cur)h='';if(!['lock','ajustes','editar','pedidos','detalle','pedido','venta','catalogo','reportes'].includes(h))h='';if(!h)depth=0;view=h||'home';render()}
function render(keep){const a=$('#app'),y=scrollY;lim=40;document.body.classList.toggle('adm',!!admin);if(view==='home'||view==='catalogo'){a.innerHTML=view==='home'?homeH():catH();grid()}else a.innerHTML=({venta:ventaH,ventaok:vokH,catalogo:catH,reportes:repH,lock:lockH,ajustes:ajH,editar:edH,pedidos:misH,detalle:detH,pedido:pedH,listo:doneH})[view]();
const n={home:1,detalle:1,pedido:1,listo:1,venta:1,ventaok:1,catalogo:2,pedidos:3,reportes:4}[view]||0;[1,2,3,4].forEach(i=>$('#n'+i).className=i===n?'on':'');if(view==='venta')vc();keep?scrollTo(0,y):scrollTo(0,0)}
const veil=v=>document.body.classList.toggle('vl',!!v);
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey,inp=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);if(k==='printscreen'){try{navigator.clipboard.writeText(' ')}catch(x){}veil(1);setTimeout(()=>veil(0),1500)}
if(e.key==='F12'||(m&&['p','s','u'].includes(k))||(m&&e.shiftKey&&['i','j','c','s'].includes(k))||(m&&k==='c'&&!inp))e.preventDefault()});
document.addEventListener('visibilitychange',()=>veil(document.hidden));
$('#t').textContent=S.cfg.name;document.title=S.cfg.name+' · Catálogo';$('#tg').textContent=S.cfg.tag||'';addEventListener('hashchange',route);route();rem();resync();setInterval(()=>{if(!document.hidden)rem()},60000);addEventListener('online',()=>{resync();rem()});
</script></body></html>
